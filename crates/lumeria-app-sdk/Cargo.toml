[package]
name = "lumeria-app-sdk"
version = "0.1.0"
edition = "2021"
description = "Public SDK for sandboxed WebAssembly mini-apps, spatial storefronts, and HUD overlays on the Lemuria 3D engine"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tritonSama/kuroshio-sdk"
readme = "README.md"
keywords = ["wasm", "gaming", "sdk", "spatial", "lemuria"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
