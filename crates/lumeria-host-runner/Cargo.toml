[package]
name = "lumeria-host-runner"
version = "0.1.0"
edition = "2021"
description = "High-performance Wasmtime execution engine for sandboxed Lumeria guest WebAssembly modules with 120Hz zero-copy ring buffers and fuel budgeting"
license = "Apache-2.0 OR MIT"

[dependencies]
lumeria-app-sdk = { path = "../lumeria-app-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
