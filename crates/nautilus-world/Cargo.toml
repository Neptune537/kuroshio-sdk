[package]
name = "nautilus-world"
version = "0.1.0"
edition = "2021"
description = "Planetary 64-bit ECEF geodesy, LocalTangentFrame, and Anchored Spatial Overlays for the Nautilus Earth Digital Twin"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tritonSama/kuroshio-sdk"
readme = "README.md"
keywords = ["geodesy", "ecef", "gis", "earth", "wgs84"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
