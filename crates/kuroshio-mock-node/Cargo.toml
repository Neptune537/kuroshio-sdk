[package]
name = "kuroshio-mock-node"
version = "0.1.0"
edition = "2021"
description = "In-memory test harness and mock Home Node simulator for developers building on the Kuroshio Gyre"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tritonSama/kuroshio-sdk"
readme = "README.md"
keywords = ["kuroshio", "mock", "test-runner", "escrow", "siws"]

[dependencies]
kuroshio-mesh = { path = "../kuroshio-mesh" }
lumeria-app-sdk = { path = "../lumeria-app-sdk" }
nautilus-world = { path = "../nautilus-world" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
