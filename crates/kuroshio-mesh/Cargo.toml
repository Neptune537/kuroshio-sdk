[package]
name = "kuroshio-mesh"
version = "0.1.0"
edition = "2021"
description = "Social clubs, squads, teams, and zero-knowledge location proofs for the Kuroshio Gyre mesh network"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tritonSama/kuroshio-sdk"
readme = "README.md"
keywords = ["p2p", "mesh", "teams", "privacy", "kuroshio"]

[dependencies]
nautilus-world = { path = "../nautilus-world" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
